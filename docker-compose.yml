services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mellow
      POSTGRES_USER: mellow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mellow -d mellow"]
      interval: 5s
      timeout: 3s
      retries: 20
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mellow:${POSTGRES_PASSWORD}@db:5432/mellow
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
volumes:
  postgres_data:
